name: AgentForge Django V0.5 real candidate 3-of-3

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -e ".[dev]" "Django>=4.2,<6"
      - run: docker build -t agentforge-django-verify:0.4 -f docker/Dockerfile.verify .
      - name: Three REAL LLM candidate cycles on synthetic Django fixture
        env:
          AGENTFORGE_LLM_API_KEY: ${{ secrets.AGENTFORGE_LLM_API_KEY }}
          AGENTFORGE_LLM_BASE_URL: https://api.deepseek.com
          AGENTFORGE_LLM_MODEL: deepseek-chat
        run: python scripts/run_django_v05_live_acceptance.py --confirm-paid-calls
      - name: Save sanitized acceptance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: django-v05-live-coding-evidence
          path: artifacts/django-v05-live/summary.json
          if-no-files-found: warn
          retention-days: 7
