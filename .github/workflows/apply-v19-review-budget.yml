name: Apply V1.9 Review Budget Patch

on:
  push:
    branches: ["fix/v1.9-per-task-review-repair-budget"]

permissions:
  contents: write

jobs:
  patch-and-test:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Apply patch
        run: python scripts/apply_v19_review_budget_patch.py
      - name: Compile
        run: python -m compileall -q src tests
      - name: Targeted regression
        run: pytest -q tests/test_autonomous_pipeline.py -k "late_discovered_task_gets_its_own_repair_budget"
      - name: Full suite
        run: pytest -q
      - name: Commit validated patch
        shell: bash
        run: |
          git config user.email "agentforge-ci@example.test"
          git config user.name "AgentForge CI"
          git add src/agentforge/autonomous.py tests/test_autonomous_pipeline.py
          git diff --cached --exit-code && { echo "No patch changes produced"; exit 1; } || true
          git commit -m "fix(autonomous): give each reviewed task a bounded repair budget"
          git push origin HEAD:fix/v1.9-per-task-review-repair-budget
