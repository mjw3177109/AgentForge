name: AgentForge Django V0.6 real DeepSeek bounded repair (manual)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  real-deepseek:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -e ".[dev]" "Django>=4.2,<6"
      - run: docker build -t agentforge-django-verify:0.4 -f docker/Dockerfile.verify .
      - name: Three REAL paid rounds (fixed synthetic fixture)
        env:
          AGENTFORGE_LLM_API_KEY: ${{ secrets.AGENTFORGE_LLM_API_KEY }}
          AGENTFORGE_LLM_BASE_URL: https://api.deepseek.com
          AGENTFORGE_LLM_MODEL: deepseek-chat
        run: python scripts/run_django_v06_live_acceptance.py --confirm-paid-calls
      - name: Upload redacted status report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: django-v06-real-deepseek-bounded-repair-report
          path: artifacts/django-v06-live/summary.json
          retention-days: 7
          if-no-files-found: warn
