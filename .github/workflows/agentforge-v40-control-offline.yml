name: AgentForge V4 Control Plane Offline

on:
  push:
    branches: ["feature/v4-*", "feature/v3-p41-integration"]
    paths:
      - 'src/agentforge/v4/**'
      - 'scripts/v4_*.py'
      - 'tests/test_v4_*.py'
      - '.github/workflows/agentforge-v40-control-offline.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: v40-offline-${{ github.ref }}
  cancel-in-progress: false

jobs:
  v40-offline:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install -e ".[dev]"
      - name: Three independent offline V4 repetitions
        shell: bash
        run: |
          set -euo pipefail
          python scripts/v4_acceptance.py --scope v4 --iterations 3
      - name: Entire repository tests and protocol (one smoke run)
        shell: bash
        run: |
          set -euo pipefail
          python scripts/v4_acceptance.py --scope full --iterations 1
