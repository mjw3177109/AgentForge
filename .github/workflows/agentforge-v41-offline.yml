name: AgentForge V4.1 Offline Security Gates

on:
  push:
    branches: ['feature/v4-*']
    paths:
      - 'src/agentforge/v41/**'
      - 'scripts/v41_*.py'
      - 'tests/test_v41_*.py'
      - 'benchmarks/v41_trusted/**'
      - '.github/workflows/agentforge-v41-*.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  v41-offline:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11','3.12']
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install -e '.[dev]'
      - name: Run all offline regression tests and protocol 3x
        shell: bash
        run: |
          set -euo pipefail
          python scripts/v41_scope_audit.py
          for iteration in 1 2 3; do
            python -m compileall -q src scripts
            python -m pytest -q
            python protocol_bundle/scripts/validate_protocol.py
          done
