name: AgentForge V2.0 Stability Acceptance

on:
  push:
    branches: ["verify/v2.0-stability"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: v20-stability-${{ github.ref }}
  cancel-in-progress: false

jobs:
  offline-chaos:
    name: Offline chaos and regression (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "${{ matrix.python-version }}"
          cache: pip
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Repeat complete suite and protocol 3 times
        shell: bash
        run: |
          set -euo pipefail
          for round in 1 2 3; do
            echo "::group::offline iteration $round/3"
            python -m compileall -q src scripts/run_v20_stability.py
            python -m pytest -q
            python protocol_bundle/scripts/validate_protocol.py
            echo "::endgroup::"
          done

  real-deepseek-stability:
    name: Three real DeepSeek hardened acceptance rounds
    needs: offline-chaos
    runs-on: ubuntu-latest
    timeout-minutes: 90
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: agentforge
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -proot"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    env:
      AGENTFORGE_LLM_BASE_URL: ${{ vars.AGENTFORGE_LLM_BASE_URL }}
      AGENTFORGE_LLM_MODEL: ${{ vars.AGENTFORGE_LLM_MODEL }}
      AGENTFORGE_LLM_API_KEY: ${{ secrets.AGENTFORGE_LLM_API_KEY }}
      AGENTFORGE_LLM_ALLOW_ANONYMOUS: ${{ vars.AGENTFORGE_LLM_ALLOW_ANONYMOUS }}
      AGENTFORGE_LLM_TIMEOUT: "90"
      AGENTFORGE_LLM_MAX_ATTEMPTS: "3"
      AGENTFORGE_V20_MYSQL_PASSWORD: root
      MYSQL_PWD: root
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install MySQL and Redis clients
        run: |
          sudo apt-get update
          sudo apt-get install -y default-mysql-client redis-tools
      - name: Install AgentForge
        run: python -m pip install -e ".[dev]"
      - name: Require real model configuration (do not silently skip)
        shell: bash
        run: |
          set -euo pipefail
          test -n "$AGENTFORGE_LLM_BASE_URL"
          test -n "$AGENTFORGE_LLM_MODEL"
          test -n "$AGENTFORGE_LLM_API_KEY"
          echo "Real external model is configured (credentials redacted)."
      - name: Verify isolated services
        run: |
          mysql --protocol=TCP -h127.0.0.1 -P3306 -uroot agentforge -e "SELECT 1;"
          redis-cli -h 127.0.0.1 -p 6379 PING
      - name: Run three independent live autonomous benchmarks and revalidate outputs
        run: |
          python scripts/run_v20_stability.py --rounds 3 --round-timeout 1200 --output-dir artifacts/v20-stability
      - name: Upload full V2.0 acceptance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agentforge-v20-stability-evidence
          path: artifacts/v20-stability/
          if-no-files-found: warn
          retention-days: 7
