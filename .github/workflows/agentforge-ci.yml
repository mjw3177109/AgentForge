name: AgentForge CI

on:
  pull_request:
    branches: [main, "agentforge/**"]
  push:
    branches: [main, "agentforge/**"]

permissions:
  contents: read

jobs:
  core-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install -e ".[dev]"
      - run: python -m compileall -q src
      - run: pytest -q
      - run: python protocol_bundle/scripts/validate_protocol.py

  shop-backend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - name: Maven test
        working-directory: server
        run: mvn -B -q test

  admin-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          package-manager-cache: false
      - name: Install dependencies
        working-directory: admin-web
        run: npm install --no-audit --no-fund
      - name: Build Vue admin
        working-directory: admin-web
        run: npm run build

  miniapp-static:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Validate mini program structure
        run: python scripts/validate_miniapp.py
