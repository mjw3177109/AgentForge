name: AgentForge CI

on:
  pull_request:
    branches: [main, "agentforge/**"]
  push:
    branches: [main, "agentforge/**", "feature/**"]

permissions:
  contents: read

jobs:
  core-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Compile
        run: python -m compileall -q src
      - name: Test
        run: pytest -q
      - name: Protocol validation
        run: python protocol_bundle/scripts/validate_protocol.py

  v17-multistack-benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: agentforge
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -proot"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    env:
      AGENTFORGE_RUN_MULTISTACK_BENCHMARK: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install MySQL and Redis clients
        run: |
          sudo apt-get update
          sudo apt-get install -y default-mysql-client redis-tools
      - name: Install AgentForge
        run: python -m pip install -e ".[dev]"
      - name: Verify service readiness
        run: |
          mysql --protocol=TCP -h127.0.0.1 -P3306 -uroot -proot agentforge -e "SELECT 1;"
          redis-cli -h 127.0.0.1 -p 6379 PING
      - name: Run V1.7 real multi-stack autonomous benchmark
        run: pytest -q tests/test_v17_multistack_benchmark.py
