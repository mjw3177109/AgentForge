name: AgentForge Django integration
on:
  push:
    branches:
      - feature/django-agent-manager-v1
  pull_request:
    paths:
      - "src/agentforge_django/**"
      - "django_tests/**"
      - "docs/DJANGO_AGENT_MANAGER.md"
      - ".github/workflows/agentforge-django-ci.yml"
jobs:
  django:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e ".[dev]" "Django>=4.2,<6"
      - run: python examples/django_host/manage.py check\n      - run: python -m django check --settings=django_tests.settings
      - run: python -m django makemigrations agentforge_django --check --dry-run --settings=django_tests.settings
      - run: python -m django test django_tests --settings=django_tests.settings -v 2
      - run: pytest -q
      - run: python protocol_bundle/scripts/validate_protocol.py
