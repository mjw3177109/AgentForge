name: AgentForge Django integration
on:
  push:
    branches:
      - feature/django-agent-manager-v1
  pull_request:
    paths:
      - "src/agentforge_django/**"
      - "django_tests/**"
      - "docs/DJANGO_AGENT_MANAGER.md"
      - ".github/workflows/agentforge-django-ci.yml"
jobs:
  django:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e ".[dev]" "Django>=4.2,<6"
      - run: python examples/django_host/manage.py check
      - run: python -m django check --settings=django_tests.settings
      - run: python -m django makemigrations agentforge_django --check --dry-run --settings=django_tests.settings
      - run: python -m django test django_tests --settings=django_tests.settings -v 2
      - name: Read-only real-model readiness inventory (NO API calls)
        run: python scripts/check_agentforge_v10_readiness.py
      - run: python examples/django_host/manage.py process_agentforge_queue --help
      - run: python examples/django_host/manage.py recover_agentforge_job --help
      - run: pytest -q
      - run: python protocol_bundle/scripts/validate_protocol.py

  docker-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -e ".[dev]" "Django>=4.2,<6"
      - name: Build offline, unprivileged verifier image
        run: docker build -t agentforge-django-verify:0.4 -f docker/Dockerfile.verify .
      - name: Execute ACTUAL Django check and one business test inside Docker
        run: python scripts/run_django_v04_docker_smoke.py
      - name: V1.6 real Docker rejects attempts to rewrite business tests
        run: python scripts/run_django_v16_write_barrier_smoke.py
      - name: V1.7 real Docker pinned-image acceptance and tag-swap protection
        run: python scripts/run_django_v17_image_identity_smoke.py
      - name: V0.5 simulated agents with ACTUAL Docker business repair acceptance
        run: python scripts/run_django_v05_smoke.py
      - name: V0.6 bounded repair (3 simulated-agent runs, 2 real Docker verifications each)
        run: python scripts/run_django_v06_smoke.py
      - name: V1.1 three DISTINCT Django benchmarks, with scripted agents and real Docker tests
        run: python scripts/run_django_v11_offline.py
      - name: Render V1.2 redacted case comparison
        if: always()
        run: |
          if [ -f artifacts/django-v11/offline-report.json ]; then
            python scripts/render_django_v12_report.py \
              --input artifacts/django-v11/offline-report.json \
              --output artifacts/django-v11/operator-summary.md
          fi
      - name: V1.5 verify role order, Docker round count and provider token consistency
        run: |
          python scripts/verify_django_v14_evidence.py \
            --input artifacts/django-v11/offline-report.json \
            --output artifacts/django-v11/v14-evidence-receipt.json \
            --expected-model SCRIPTED_FAKE_AGENT --require-pass
      - name: Archive V1.5 validated offline case evidence and operator summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agentforge-v15-scripted-agent-real-docker-evidence
          path: artifacts/django-v11/
          retention-days: 14
          if-no-files-found: warn
