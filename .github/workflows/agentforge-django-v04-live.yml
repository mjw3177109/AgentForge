name: AgentForge Django V0.4 - REAL DeepSeek read-only gate

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -e ".[dev]" "Django>=4.2,<6"
      - name: Validate REAL model settings (fail closed)
        env:
          AGENTFORGE_LLM_API_KEY: ${{ secrets.AGENTFORGE_LLM_API_KEY }}
          AGENTFORGE_LLM_BASE_URL: ${{ vars.AGENTFORGE_LLM_BASE_URL }}
          AGENTFORGE_LLM_MODEL: ${{ vars.AGENTFORGE_LLM_MODEL }}
        run: python scripts/run_django_v04_live_acceptance.py
      - name: Archive read-only model evidence even after failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: django-v04-deepseek-readonly-evidence
          path: artifacts/django-v04-live/summary.json
          if-no-files-found: warn
          retention-days: 7
