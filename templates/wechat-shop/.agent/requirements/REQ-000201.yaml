id: REQ-000201
title: 商品收藏
status: READY
actors:
  - CUSTOMER
modules:
  - product
  - favorite
business_rules:
  - 用户可以收藏商品
  - 用户可以取消收藏
  - 同一个用户与商品不能重复收藏
  - 商品下架不删除已有收藏记录
acceptance:
  - 商品详情可以查询当前用户是否已收藏
  - 用户可以收藏和取消收藏
  - 个人中心可以读取收藏商品ID列表
out_of_scope:
  - 管理后台收藏管理
  - 收藏夹分类
  - 收藏提醒
created_at: "2026-10-17T08:36:00Z"
