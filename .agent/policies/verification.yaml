checks:
  backend-test:
    type: docker_command
    image: maven:3.9.9-eclipse-temurin-17
    cwd: server
    command: ["mvn", "-B", "-q", "test"]
    network: true
    timeout: 1200

  admin-build:
    type: docker_command
    image: node:24-bookworm-slim
    cwd: admin-web
    command: ["bash", "-lc", "npm install --no-audit --no-fund && npm run build"]
    network: true
    timeout: 900

  miniapp-check:
    type: docker_command
    image: python:3.12-slim
    cwd: .
    command: ["python", "scripts/validate_miniapp.py"]
    network: false
    timeout: 300
