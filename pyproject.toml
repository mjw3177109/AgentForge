[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agentforge-core"
version = "0.6.0"
description = "GitHub-driven constrained multi-agent software engineering core"
requires-python = ">=3.11"
dependencies = ["PyYAML>=6.0", "jsonschema>=4.21", "pydantic>=2.8"]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
agentforge = "agentforge.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"
